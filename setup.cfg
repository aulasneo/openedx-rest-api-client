[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra

[flake8]
max-line-length = 120
exclude =
    .git,
    venv,
    dist,
    build,
    *.egg-info
extend-ignore =
    W503,
    # E501: docstrings carry long reference URLs we intentionally do not wrap.
    E501
per-file-ignores =
    # Re-exports for the public package API.
    openedx_rest_api_client/__init__.py:F401
    openedx_rest_api_client/exceptions.py:F401
